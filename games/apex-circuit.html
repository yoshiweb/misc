  <title>Apex Circuit — 3D Arcade Racing</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7fb;background:#07101d;color-scheme:dark}

    #joystick{position:fixed;left:clamp(78px,14vw,170px);bottom:clamp(42px,9vh,102px);width:clamp(128px,20vw,196px);height:clamp(128px,20vw,196px);z-index:6;border:1px solid #d5eeff3a;border-radius:50%;background:radial-gradient(circle,#d8f4ff14 0 32%,#d8f4ff09 33% 62%,#d8f4ff04 63%);box-shadow:inset 0 0 30px #bdeaff14,0 10px 35px #0004;touch-action:none;transition:opacity .2s}.joystick-ring{position:absolute;inset:18%;border:1px solid #d5eeff2f;border-radius:50%}.joystick-knob{position:absolute;left:50%;top:50%;width:38%;height:38%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 32% 28%,#e9fbff,#72bdd1 64%,#327487);box-shadow:0 5px 18px #0018,0 0 22px #64dff588;transition:transform .07s ease-out}.joystick-hint{position:absolute;inset:0;display:grid;place-items:center;color:#d7f3ff66;font-size:9px;font-weight:900;letter-spacing:.15em;pointer-events:none}.joystick-hint span{position:absolute}.joystick-hint .up{top:10px}.joystick-hint .down{bottom:10px}.joystick-hint .left{left:10px}.joystick-hint .right{right:10px}

    @media (orientation:portrait){#joystick{left:50%;bottom:32px}.hud{padding-bottom:220px}.stats{gap:8px}.stat strong{font-size:24px}#minimap{top:118px;right:14px}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Apex Circuit 3D racing game"></canvas><div id="speedLines"></div><div class="vignette"></div>
  <div class="hud"><div class="brand">ARCADE MOTORSPORT<b>APEX CIRCUIT</b></div><div class="stats"><div class="stat"><small>SPEED</small><strong id="speedValue">0<em> KM/H</em></strong></div><div class="stat"><small>LAP</small><strong id="lapValue">1/3</strong></div><div class="stat"><small>POS</small><strong id="positionValue">6/6</strong></div></div></div>
  <div id="minimap"><div class="map-label">CIRCUIT // SECTOR 01</div></div><div id="message"><div class="message-kicker"></div><div class="message-title"></div><div class="message-sub"></div></div>
  <div id="joystick" aria-label="Virtual joystick"><div class="joystick-ring"></div><div class="joystick-knob" id="joystickKnob"></div><div class="joystick-hint"><span class="up">THROTTLE</span><span class="down">BRAKE</span><span class="left">‹</span><span class="right">›</span></div></div>
  <section class="screen" id="titleScreen"><div class="panel"><div class="eyebrow">SINGLE PLAYER // MOBILE ARCADE</div><h1>APEX <span>CIRCUIT</span></h1><p>ジョイスティックを前に倒して加速。左右でラインを選び、6台のマシンを追い抜け。コースアウトに注意。</p><button class="primary" id="startButton">START RACE</button></div></section>
  <section class="screen hidden" id="resultsScreen"><div class="panel"><div class="eyebrow">RACE COMPLETE</div><h2 id="resultTitle">CHECKERED FLAG</h2><p id="resultTime">TIME 00:00.00</p><div class="results" id="resultsList"></div><button class="primary" id="restartButton">RACE AGAIN</button></div></section>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js';

    const canvas=document.querySelector('#game'), renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.65)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace;
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9dc8d8); scene.fog=new THREE.Fog(0x9dc8d8,125,390);
    const camera=new THREE.PerspectiveCamera(62,1,.1,600); camera.position.set(0,5,10);
    scene.add(new THREE.HemisphereLight(0xe5f7ff,0x34523a,2.4)); const sun=new THREE.DirectionalLight(0xffe2b4,3.4); sun.position.set(-80,120,50); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-150; sun.shadow.camera.right=150; sun.shadow.camera.top=150; sun.shadow.camera.bottom=-150; scene.add(sun);
    const mats={road:new THREE.MeshStandardMaterial({color:0x293742,roughness:.94}), edge:new THREE.MeshStandardMaterial({color:0xf0dfbb,roughness:.75}), grass:new THREE.MeshStandardMaterial({color:0x3c704e,roughness:1}), line:new THREE.MeshBasicMaterial({color:0xf6e4a7}), barrier:new THREE.MeshStandardMaterial({color:0xc95751,roughness:.65}), white:new THREE.MeshStandardMaterial({color:0xe8edf0,roughness:.5}), tree:new THREE.MeshStandardMaterial({color:0x1e624a,roughness:1}), trunk:new THREE.MeshStandardMaterial({color:0x64442e}), building:new THREE.MeshStandardMaterial({color:0x667b8a,roughness:.8}), glass:new THREE.MeshStandardMaterial({color:0x8dd7e7,metalness:.2,roughness:.2}), tire:new THREE.MeshStandardMaterial({color:0x0c1014,roughness:1})};
    const v=new THREE.Vector3(); const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const lerp=(a,b,t)=>a+(b-a)*t; const TAU=Math.PI*2;

    // A compact sampled loop: long straight, hairpin, chicane, and an elevated sweeper.
    const control=[[-72,-70],[-20,-90],[48,-72],[78,-24],[58,17],[82,58],[32,88],[-35,76],[-78,42],[-92,-5],[-62,-35]];
    function cat(a,b,c,d,t){return .5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t)}
    const center=[]; for(let i=0;i<control.length;i++){const a=control[(i-1+control.length)%control.length],b=control[i],c=control[(i+1)%control.length],d=control[(i+2)%control.length];for(let j=0;j<18;j++){const t=j/18;center.push(new THREE.Vector3(cat(a[0],b[0],c[0],d[0],t),0,cat(a[1],b[1],c[1],d[1],t)))}}
    const N=center.length, width=12, segmentLength=1; const track=new THREE.Group(); scene.add(track);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(560,560),mats.grass); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
    function tangent(i){const p=center[(i+1)%N],q=center[(i-1+N)%N];return new THREE.Vector3(p.x-q.x,0,p.z-q.z).normalize()} function side(i){const t=tangent(i);return new THREE.Vector3(-t.z,0,t.x)}
    for(let i=0;i<N;i++){const p=center[i],t=tangent(i),s=side(i);const road=new THREE.Mesh(new THREE.BoxGeometry(width,.28,segmentLength+1.5),mats.road); road.position.copy(p);road.position.y=.16;road.rotation.y=Math.atan2(t.x,t.z);road.receiveShadow=true;track.add(road);for(const off of [-width/2+.35,width/2-.35]){const e=new THREE.Mesh(new THREE.BoxGeometry(.42,.1,segmentLength+1.5),mats.edge);e.position.copy(p).addScaledVector(s,off);e.position.y=.35;e.rotation.y=road.rotation.y;track.add(e)} if(i%5===0){const dash=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,2.8),mats.line);dash.position.copy(p);dash.position.y=.38;dash.rotation.y=road.rotation.y;track.add(dash)}}
    function box(parent,geo,mat,pos,scale,rot=0){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.scale.set(...scale);m.rotation.y=rot;m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
    const scenery=new THREE.Group(); scene.add(scenery); for(let i=0;i<N;i+=3){const p=center[i],s=side(i),t=tangent(i),rot=Math.atan2(t.x,t.z);for(const lane of [-1,1]){const q=p.clone().addScaledVector(s,lane*(width/2+7+((i*17)%13)));q.y=0;if(i%17===0&&lane>0){box(scenery,new THREE.BoxGeometry(5,7,5),mats.building,[q.x,3.5,q.z],[1+((i%3)*.25),1,1],rot);box(scenery,new THREE.BoxGeometry(5.2,.12,5.2),mats.glass,[q.x,5.3,q.z],[1,1,1],rot)}else if(i%4===0){box(scenery,new THREE.CylinderGeometry(.3,.45,3.2,7),mats.trunk,[q.x,1.6,q.z],[1,1,1],0);const crown=new THREE.Mesh(new THREE.ConeGeometry(2.5,5.5,8),mats.tree);crown.position.set(q.x,5,q.z);crown.castShadow=true;scenery.add(crown)}}}
    // Curbs and guard rails around tighter sections create a readable racing line.
    for(let i=0;i<N;i+=2){if(i>50&&i<135||i>230&&i<285){const p=center[i],s=side(i),t=tangent(i);for(const lane of [-1,1]){const q=p.clone().addScaledVector(s,lane*(width/2+1.4));box(track,new THREE.BoxGeometry(.45,.75,2.8),mats.barrier,[q.x,.7,q.z],[1,1,1],Math.atan2(t.x,t.z))}}}
    const startGate=new THREE.Group();scene.add(startGate);for(const x of [-width/2, width/2])box(startGate,new THREE.BoxGeometry(.5,6,.5),mats.white,[center[0].x+x,3,center[0].z], [1,1,1],0);box(startGate,new THREE.BoxGeometry(width+1,.45,.5),mats.white,[center[0].x,5.8,center[0].z],[1,1,1],0);
    const carGeo={body:new THREE.BoxGeometry(2.25,.6,4.25),hood:new THREE.BoxGeometry(1.8,.28,1.7),wheel:new THREE.CylinderGeometry(.39,.39,.28,12),spoiler:new THREE.BoxGeometry(2.4,.12,.45)};
    function makeCar(color){const g=new THREE.Group(),bodyMat=new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.38}),dark=new THREE.MeshStandardMaterial({color:0x101c27,metalness:.2,roughness:.2});box(g,carGeo.body,bodyMat,[0,.72,0],[1,1,1]);box(g,carGeo.hood,bodyMat,[0,1.08,-.65],[1,1,1]);box(g,carGeo.spoiler,dark,[0,1.14,1.7],[1,1,1]);box(g,new THREE.BoxGeometry(1.35,.3,1.35),mats.glass,[0,1.32,.35],[1,1,1]);for(const x of [-1.12,1.12])for(const z of [-1.38,1.38]){const w=new THREE.Mesh(carGeo.wheel,mats.tire);w.rotation.z=Math.PI/2;w.position.set(x,.48,z);g.add(w)}g.traverse(o=>{o.castShadow=true});return g}
    const colors=[0x48d8e8,0xef5b5b,0xf2b84b,0x9a7cff,0x79d26d,0xf092c1], racers=[]; function resetRacers(){racers.length=0;for(let i=0;i<6;i++){const car=makeCar(colors[i]);scene.add(car);racers.push({mesh:car,progress:(N-8-i*8+N)%N,lap:0,lateral:(i-2.5)*1.25,speed:0,target:22+i*1.1,skill:.86+i*.025,mistake:0,finished:false})}player=racers[0];}
    let player; resetRacers();
    const input={x:0,y:0,active:false}; const joystick=document.querySelector('#joystick'),knob=document.querySelector('#joystickKnob'); let pointerId=null;
    function setStick(e){const r=joystick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),rad=r.width*.38,dist=Math.hypot(dx,dy),scale=Math.min(1,rad/Math.max(rad,dist));input.x=clamp(dx/rad*scale,-1,1);input.y=clamp(dy/rad*scale,-1,1);knob.style.transform=`translate(calc(-50% + ${input.x*rad}px),calc(-50% + ${input.y*rad}px))`}
    joystick.addEventListener('pointerdown',e=>{if(state.phase!=='race')return;pointerId=e.pointerId;input.active=true;joystick.setPointerCapture(pointerId);setStick(e);}); joystick.addEventListener('pointermove',e=>{if(e.pointerId===pointerId)setStick(e)}); function release(e){if(e.pointerId!==pointerId)return;input.active=false;pointerId=null;input.x=input.y=0;knob.style.transform='translate(-50%,-50%)'} joystick.addEventListener('pointerup',release);joystick.addEventListener('pointercancel',release);
    function nearestProgress(pos){let best=0,bd=1e9;for(let i=0;i<N;i++){const d=center[i].distanceTo(pos);if(d<bd){bd=d;best=i}}return best}
    const audio={ctx:null,osc:null,gain:null,init(){if(this.ctx)return;this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.osc=this.ctx.createOscillator();this.gain=this.ctx.createGain();this.osc.type='sawtooth';this.osc.connect(this.gain).connect(this.ctx.destination);this.gain.gain.value=0;this.osc.start()},update(speed){if(!this.ctx)return;this.gain.gain.value=.018;this.osc.frequency.setTargetAtTime(65+speed*3.5,this.ctx.currentTime,.04)},beep(freq,dur=.12){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.frequency.value=freq;o.connect(g).connect(this.ctx.destination);g.gain.setValueAtTime(.08,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+dur);o.start();o.stop(this.ctx.currentTime+dur)}};
    const state={phase:'title',laps:3,time:0,countdown:0,paused:false,last:performance.now()};
    function place(r){const p=center[Math.floor(r.progress)%N],s=side(Math.floor(r.progress)%N);r.mesh.position.copy(p).addScaledVector(s,r.lateral);r.mesh.position.y=.25;r.mesh.rotation.y=Math.atan2(tangent(Math.floor(r.progress)%N).x,tangent(Math.floor(r.progress)%N).z)}
    function showMessage(kicker,title,sub,time=1.2){const el=document.querySelector('#message');el.querySelector('.message-kicker').textContent=kicker;el.querySelector('.message-title').textContent=title;el.querySelector('.message-sub').textContent=sub;el.style.opacity=1;clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>el.style.opacity=0,time*1000)}
    function start(){audio.init();if(audio.ctx.state==='suspended')audio.ctx.resume();document.querySelector('#titleScreen').classList.add('hidden');document.querySelector('#resultsScreen').classList.add('hidden');document.querySelector('#joystick').style.opacity=1;resetRacers();state.phase='countdown';state.countdown=3.4;state.time=0;for(const r of racers){r.lap=0;r._prev=r.progress;r.finished=false;place(r)}showMessage('GET READY','3','JOYSTICK TO DRIVE',1.1)}
    function finish(){state.phase='results';document.querySelector('#joystick').style.opacity=0;const sorted=[...racers].sort((a,b)=>(b.lap*N+b.progress)-(a.lap*N+a.progress));document.querySelector('#resultTitle').textContent=player.lap>=state.laps?'CHECKERED FLAG':'RACE OVER';document.querySelector('#resultTime').textContent=`TIME ${formatTime(state.time)}`;document.querySelector('#resultsList').innerHTML=sorted.map((r,i)=>`<div class="result-row"><b>${i+1}</b><span class="${r===player?'you':''}">${r===player?'YOU':'RIVAL '+i}</span><span>${r===player?formatTime(state.time):`${Math.max(0,(state.time-(i+1)*.37)).toFixed(2)}s`}</span></div>`).join('');document.querySelector('#resultsScreen').classList.remove('hidden');audio.update(0)}
    function formatTime(t){const m=Math.floor(t/60).toString().padStart(2,'0'),s=(t%60).toFixed(2).padStart(5,'0');return `${m}:${s}`}
    function update(dt){if(state.phase==='countdown'){state.countdown-=dt;if(state.countdown<=0){state.phase='race';showMessage('RACE ON','GO','',.6);audio.beep(880)}else{const n=Math.ceil(state.countdown);document.querySelector('#message .message-title').textContent=n;audio.beep(360+n*80,.08)}return}if(state.phase!=='race'||state.paused)return;state.time+=dt;
      const throttle=clamp(-input.y,0,1),brake=clamp(input.y,0,1),steer=input.x;player.speed=clamp(player.speed+(throttle*34-brake*62-8)*dt, -10,48);if(!input.active)player.speed=clamp(player.speed-12*dt,-10,48);player.lateral+=steer*dt*(player.speed*.17);player.lateral*=Math.pow(.985,dt*60);player.lateral=clamp(player.lateral,-5.05,5.05);player.progress=(player.progress+player.speed*dt)%N;if(player.progress<0)player.progress+=N;const oldLap=player.lap;player.lap=Math.floor((player.lap*N+player.progress)/(N)); // overwritten below for stable wrap tracking
      if(player.progress<player._prev)player.lap++;player._prev=player.progress;if(player.lap>=state.laps){player.lap=state.laps;finish();return}place(player);
      for(let i=1;i<racers.length;i++){const r=racers[i],gap=(player.progress-r.progress+N)%N;r.mistake=Math.max(0,r.mistake-dt);const desired=r.target+(Math.sin(state.time*.7+i)*1.6);r.speed=lerp(r.speed,desired*(r.mistake? .48:1),dt*1.8);r.progress=(r.progress+r.speed*dt)%N;r.lateral=lerp(r.lateral,Math.sin(r.progress*.055+i)*2.7,dt*1.8);if(gap<4&&gap>0)r.lateral+=Math.sign(r.lateral||1)*dt*1.8;if(Math.random()<dt*.004)r.mistake=1.2;place(r)}
      for(let i=0;i<racers.length;i++)for(let j=i+1;j<racers.length;j++){const a=racers[i],b=racers[j];if(a.mesh.position.distanceTo(b.mesh.position)<2.5){const push=a.mesh.position.clone().sub(b.mesh.position).normalize();a.lateral+=push.dot(side(Math.floor(a.progress)%N))*dt*12;b.lateral-=push.dot(side(Math.floor(b.progress)%N))*dt*12;a.speed*=.91;b.speed*=.91}}
      const ranking=[...racers].sort((a,b)=>(b.lap*N+b.progress)-(a.lap*N+a.progress));document.querySelector('#positionValue').textContent=`${ranking.indexOf(player)+1}/6`;document.querySelector('#lapValue').textContent=`${Math.min(player.lap+1,state.laps)}/${state.laps}`;document.querySelector('#speedValue').innerHTML=`${Math.round(Math.max(0,player.speed)*4.2)}<em> KM/H</em>`;audio.update(player.speed);document.querySelector('#speedLines').style.opacity=clamp((player.speed-28)/22,0,.48);updateCamera(dt);updateMap()
    }
    function updateCamera(dt){const i=Math.floor(player.progress)%N,p=player.mesh.position,t=tangent(i),desired=p.clone().addScaledVector(t,-10).add(new THREE.Vector3(0,5.8,0));camera.position.lerp(desired,1-Math.pow(.001,dt));const look=p.clone().addScaledVector(t,8).add(new THREE.Vector3(0,1.1,0));v.lerp(look,1-Math.pow(.003,dt));camera.lookAt(v);camera.fov=lerp(camera.fov,62+player.speed*.35,1-Math.pow(.02,dt));camera.updateProjectionMatrix()}
    function updateMap(){for(const r of racers){let d=r.map;if(!d){d=document.createElement('i');d.className='map-dot';document.querySelector('#minimap').appendChild(d);r.map=d}const p=center[Math.floor(r.progress)%N];const minX=-105,maxX=100,minZ=-105,maxZ=100;d.style.left=`${clamp((p.x-minX)/(maxX-minX)*100,3,97)}%`;d.style.top=`${clamp((p.z-minZ)/(maxZ-minZ)*100,5,92)}%`;d.classList.toggle('player',r===player)}}
    document.querySelector('#startButton').addEventListener('click',start);document.querySelector('#restartButton').addEventListener('click',start);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p'&&state.phase==='race'){state.paused=!state.paused;showMessage('PAUSED',state.paused?'PAUSED':'RESUME','PRESS P TO CONTINUE',1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='race')state.paused=true});
    function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();updateMap();for(const r of racers)place(r);
    function frame(now){const dt=Math.min(.05,(now-state.last)/1000);state.last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
  </script>
</body>
