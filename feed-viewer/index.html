<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W2L9NES4NJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag("js", new Date());
        gtag("config", "G-W2L9NES4NJ");
    </script>
    <title>RSS Feed Viewer</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="misc.yoshiweb.net">
    <meta property="og:title" content="RSS Feed Viewer">
    <meta property="og:description" content="RSSフィードをまとめて読む。">
    <meta property="og:url" content="https://misc.yoshiweb.net/feed-viewer/">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:image" content="https://misc.yoshiweb.net/assets/images/ogp/feed-viewer-home.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="RSS Feed Viewerの紹介画像">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="container">
        <header>
            <h1>RSS Feed Viewer</h1>
            <form id="rss-form" class="rss-form">
                <input type="url" id="rss-url" placeholder="Enter RSS feed URL" required>
                <button type="submit" id="fetch-rss">
                    <span class="material-symbols-outlined">add</span>
                    Add Feed
                </button>
            </form>
        </header>
        <main>
            <section class="catalog" aria-labelledby="catalog-title">
                <div class="catalog-heading">
                    <div>
                        <p class="eyebrow">START WITH A FEED</p>
                        <h2 id="catalog-title">読みたいRSSを見つける</h2>
                        <p class="catalog-description">カテゴリを選ぶと、すぐに登録できるフィードを表示します。</p>
                    </div>
                    <span class="catalog-count" id="catalog-count"></span>
                </div>
                <div class="category-tabs" id="category-tabs" role="tablist" aria-label="RSSカテゴリ"></div>
                <div class="catalog-list" id="catalog-list" aria-live="polite"></div>
            </section>
            <div id="rss-feed-columns"></div>
        </main>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="feeds.js?v=1"></script>
    <script src="app.js?v=8"></script>
</body>
</html>
