<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Feed Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="container">
        <header>
            <h1>RSS Feed Viewer</h1>
            <form id="rss-form" class="rss-form">
                <input type="url" id="rss-url" placeholder="Enter RSS feed URL" required>
                <button type="submit" id="fetch-rss">
                    <span class="material-symbols-outlined">add</span>
                    Add Feed
                </button>
            </form>
        </header>
        <main>
            <div id="rss-feed-columns"></div>
        </main>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="app.js?v=2"></script>
</body>
</html>
