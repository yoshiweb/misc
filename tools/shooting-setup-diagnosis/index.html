</style></head><body><header class="topbar"><a class="brand" href="../../">misc<span>.yoshiweb.net</span></a><span class="privacy">✓ ブラウザ内で診断</span></header><main class="container"><p class="eyebrow">SHOOTING SETUP DIAGNOSIS</p><h1>今の撮影に、何を足せばいい？</h1><p class="lead">用途・場所・困っていることから、最初に改善効果が大きい道具だけを整理します。全部そろえる必要はありません。</p><section class="panel"><fieldset class="question"><legend>何を撮りますか？</legend><div class="options"><label class="option"><input type="radio" name="use" value="product" checked>商品・フリマ</label><label class="option"><input type="radio" name="use" value="talk">顔出し・解説</label><label class="option"><input type="radio" name="use" value="pet">ペット</label><label class="option"><input type="radio" name="use" value="food">料理</label></div></fieldset><fieldset class="question"><legend>主な場所は？</legend><div class="options"><label class="option"><input type="radio" name="place" value="room" checked>室内</label><label class="option"><input type="radio" name="place" value="outdoor">屋外</label></div></fieldset><fieldset class="question"><legend>一番困っていることは？</legend><div class="options"><label class="option"><input type="radio" name="problem" value="dark" checked>暗い・影が強い</label><label class="option"><input type="radio" name="problem" value="shake">手ブレ・構図</label><label class="option"><input type="radio" name="problem" value="sound">音が聞き取りにくい</label><label class="option"><input type="radio" name="problem" value="background">背景が散らかる</label></div></fieldset><div class="result" id="result" aria-live="polite"></div></section></main><script>
(()=>{const base={light:{name:'撮影用ライト',note:'明るさと色温度を調整できるもの。まず光を整えると、画質と色が安定します。',keyword:'スマホ 撮影ライト'},tripod:{name:'スマホ三脚・スタンド',note:'高さ・角度・スマホの固定方法が用途に合うもの。',keyword:'スマホ 三脚 スタンド'},mic:{name:'ワイヤレスマイク',note:'スマホとの接続方式と端子の対応を確認。',keyword:'スマホ ワイヤレスマイク'},background:{name:'撮影用背景布・背景紙',note:'無地で反射しにくく、商品や料理に合う色を選びます。',keyword:'商品撮影 背景布'},reflector:{name:'レフ板',note:'光を反射して顔や商品の影をやわらげます。',keyword:'撮影 レフ板'},mat:{name:'ペット用撮影マット',note:'滑りにくく、汚れても洗えるもの。',keyword:'ペット 撮影 マット'}};function selected(name){return document.querySelector(`input[name="${name}"]:checked`).value}function render(){const use=selected('use'),place=selected('place'),problem=selected('problem');let ids=[];if(problem==='dark'||place==='room')ids.push('light');if(problem==='shake')ids.push('tripod');if(problem==='sound'||use==='talk')ids.push('mic');if(problem==='background'||use==='product'||use==='food')ids.push('background');if(use==='pet')ids.push('mat');if(problem==='dark')ids.push('reflector');ids=[...new Set(ids)].slice(0,4);const labels={product:'商品・フリマ',talk:'顔出し・解説',pet:'ペット',food:'料理'};const box=document.getElementById('result');box.innerHTML=`<div class="summary"><strong>${labels[use]}・${place==='room'?'室内':'屋外'}なら、まず${base[ids[0]].name}から。</strong><br>困りごとに直結するものを優先しています。今あるスマホと自然光で試してから追加しても構いません。</div><div class="gear">${ids.map((id,i)=>{const p=base[id];const card=document.createElement('div');return `<article class="card"><span class="priority">${i===0?'優先度 1':'優先度 '+(i+1)}</span><h3>${p.name}</h3><p>${p.note}</p><div class="links" data-product="${id}"></div></article>`}).join('')}</div><div class="disclosure">商品リンクは選択肢を探すためのものです。アフィリエイト広告を利用しています。</div>`;ids.forEach(id=>{const el=box.querySelector(`[data-product="${id}"]`);Affiliate.storeLinks(base[id]).forEach(l=>el.appendChild(Affiliate.storeLinkElement(l)))})}document.querySelectorAll('input').forEach(i=>i.addEventListener('change',render));render()})()
</script></body></html>
