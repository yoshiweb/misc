:root{--ink:#182230;--muted:#667085;--line:#e4e7ec;--page:#f5f7fb;--primary:#3157d5;--soft:#eef2ff;--surface:#fff;--success:#067647}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.55}button,select{font:inherit}button{cursor:pointer}.topbar{display:flex;justify-content:space-between;max-width:980px;margin:auto;padding:20px 18px}.brand{color:var(--ink);font-weight:800;text-decoration:none}.brand span{color:var(--primary)}.privacy{color:var(--success);font-size:.75rem;font-weight:700;background:#ecfdf3;border:1px solid #abefc6;border-radius:999px;padding:5px 9px}.container{width:min(980px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.eyebrow{color:var(--primary);font-size:.75rem;font-weight:800;letter-spacing:.12em;margin:0 0 8px}h1{font-size:clamp(1.8rem,5vw,2.7rem);letter-spacing:-.04em;margin:0}.lead{color:var(--muted);max-width:680px;margin:10px 0 24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px #10182812;padding:20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{padding:15px 10px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:11px;font-weight:800;color:var(--muted)}.choice.active{color:var(--primary);background:var(--soft);border-color:#aab9f5}.result{margin-top:18px;display:grid;gap:18px}.group h2{font-size:1rem;margin:0 0 9px}.item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f1f3f6}.item input{margin-top:4px;accent-color:var(--primary)}.item strong{display:block}.item small{display:block;color:var(--muted);margin-top:2px}.product{padding:14px;background:#f8faff;border:1px solid #dfe5fb;border-radius:11px}.product h3{font-size:.9rem;margin:0}.product p{color:var(--muted);font-size:.8rem;margin:4px 0 10px}.links{display:flex;flex-wrap:wrap;gap:7px}.notice{font-size:.74rem;color:#667085;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}@media(max-width:600px){.choices{grid-template-columns:1fr}.topbar{padding:16px 12px}.privacy{font-size:.65rem}}
</style></head><body><header class="topbar"><a class="brand" href="../../">misc<span>.yoshiweb.net</span></a><span class="privacy">✓ ブラウザ内で作成</span></header><main class="container"><p class="eyebrow">CHECKLIST MAKER</p><h1>買う前に、必要なものを整理する。</h1><p class="lead">用途を選ぶと、必須・あると便利・選ぶ基準をまとめます。チェック状態はこのブラウザにだけ保存されます。</p><section class="panel"><div class="choices" id="choices"><button class="choice active" data-use="moving">引っ越し</button><button class="choice" data-use="travel">旅行</button><button class="choice" data-use="fleamarket">フリマ出品</button><button class="choice" data-use="work">在宅勤務</button><button class="choice" data-use="shooting">撮影</button><button class="choice" data-use="disaster">防災</button></div><div class="result" id="result"></div><p class="notice">商品リンクは、チェックリストの条件に合う選択肢を探すためのものです。アフィリエイト広告を利用しています。</p></section></main><script>
(()=>{const data={moving:{title:'引っ越し',must:[['段ボール・梱包資材','荷物量に合うサイズを複数用意'],['養生テープ・油性ペン','床や壁を傷つけず、箱の中身を記録'],['ゴミ袋・掃除用品','退去前と入居直後に使う'],['重要書類のファイル','契約書・鍵・ライフライン情報をまとめる']],nice:[['台車','重い箱を一人で移動しやすくする'],['メジャー','家具が搬入できるか事前に確認']]},travel:{title:'旅行',must:[['充電器・モバイルバッテリー','端末ごとではなく端子を確認'],['常用薬・身分証の控え','原本と分けて保管'],['圧縮袋・小分けポーチ','荷物を用途別にまとめる'],['折りたたみバッグ','帰りの荷物や土産に対応']],nice:[['ネックピロー','移動時間が長い場合に検討'],['防水ポーチ','濡れたものと貴重品を分ける']]},fleamarket:{title:'フリマ出品',must:[['撮影用の明るい場所','商品の傷や色が伝わる光を確保'],['背景布・無地のシート','商品に視線を集める'],['梱包材・テープ','売れた後にすぐ発送できる'],['メジャー・はかり','サイズと送料を正確に記載']],nice:[['ラベルシール','在庫と発送先を取り違えにくくする'],['撮影用ライト','室内でも明るさを安定させる']]},work:{title:'在宅勤務',must:[['安定した通信環境','仕事場所の電波と回線を確認'],['外付けキーボード・マウス','長時間作業の姿勢を整える'],['イヤホン・マイク','会議で声と周囲の音を確認'],['書類を置く場所','机の上を作業に集中できる状態に']],nice:[['モニター台','画面の高さを調整'],['デスクライト','顔と手元の明るさを補う']]},shooting:{title:'スマホ撮影',must:[['明るい光','窓際またはライトで影を確認'],['スマホを固定するもの','三脚やスタンドで手ブレを防ぐ'],['背景を整えるもの','無地の布や紙で余計な情報を減らす'],['十分な空き容量','撮影前に不要な動画を整理']],nice:[['ワイヤレスマイク','話す動画の音声を安定させる'],['レフ板','顔や商品の影をやわらげる']]},disaster:{title:'防災',must:[['水','1人1日3Lを目安に置き場所も確認'],['携帯トイレ','1人1日5回を目安に数量を確認'],['すぐ食べられる主食','保存期間と普段の味を確認'],['ライト・乾電池','停電直後に使える場所へ置く']],nice:[['モバイルバッテリー','充電方法と容量を確認'],['給水袋','給水車から運べる容量を選ぶ']]}};const products={shooting:[{name:'スマホ三脚・スタンド',note:'固定できる高さと、スマホの幅に合うもの。',keyword:'スマホ 三脚 スタンド'},{name:'撮影用ライト',note:'明るさと色温度を調整できるもの。',keyword:'スマホ 撮影ライト'},{name:'ワイヤレスマイク',note:'スマホとの接続方式と対応端子を確認。',keyword:'スマホ ワイヤレスマイク'}],disaster:[{name:'長期保存水',note:'保存期間と保管場所を確認。',keyword:'長期保存水 5年'},{name:'携帯トイレ',note:'凝固剤・袋・保管袋のセットを確認。',keyword:'携帯トイレ 防災 セット'}],fleamarket:[{name:'撮影用ライト',note:'室内でも色と傷が伝わる明るさに。',keyword:'商品撮影 ライト'}]};let use='moving';const result=document.getElementById('result');function item([name,note]){return `<label class="item"><input type="checkbox"><span><strong>${name}</strong><small>${note}</small></span></label>`}function render(){const d=data[use];result.innerHTML=`<div class="group"><h2>必須</h2>${d.must.map(item).join('')}</div><div class="group"><h2>あると便利</h2>${d.nice.map(item).join('')}</div>`;const ps=products[use]||[];if(ps.length){const box=document.createElement('div');box.className='group';box.innerHTML='<h2>選ぶ基準から探す</h2>';ps.forEach(p=>{const card=document.createElement('article');card.className='product';card.innerHTML=`<h3>${p.name}</h3><p>${p.note}</p><div class="links"></div>`;Affiliate.storeLinks({name:p.name,searchKeyword:p.keyword}).forEach(l=>card.querySelector('.links').appendChild(Affiliate.storeLinkElement(l)));box.appendChild(card)});result.appendChild(box)}document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.use===use))}document.getElementById('choices').addEventListener('click',e=>{const b=e.target.closest('.choice');if(b){use=b.dataset.use;render()}});render()})()
</script></body></html>
